include:
  - project: 'inwoker/tgs/tgs-gitlab-ci-jobs'
    ref: main
    file: '/templates/.lobby-deployment.yaml'

variables:
  ImageName: pgtgs/lobby-t10
  
build:
  extends: .build
  only:
    - master
    - release/current
    - develop

deploy-dev:
  extends: .deploy-base
  variables:
    namespace: "dev"
    components: "dev_t10"
  only:
    - develop

deploy-staging:
  extends: .deploy-base
  variables:
    namespace: "staging"
    components: "staging_t10"
  only:
    - release/current

deploy-staging-28win:
  extends: .deploy-base
  variables:
    namespace: "staging"
    components: "staging_t10_28win"
  only:
    - 28win

deploy-prod:
  extends: .deploy-base
  variables:
    namespace: "prod"
    components: "prod_t10"
  only:
    - master

deploy-prod-28win:
  extends: .deploy-base
  variables:
    namespace: "prod"
    components: "prod_t10_28win"
  only:
    - 28win_prod