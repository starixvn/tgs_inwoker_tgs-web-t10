variables:
  ImageName: pgtgs/lobby-t10
  GIT_SUBMODULE_STRATEGY: recursive # 會把submodule中的submodule也引進到項目中
  message: ""
  
stages:
  - deploy

cache:
  paths:
    - node_modules/

deploy-dev:
  stage: deploy
  variables:
    GIT_STRATEGY: none
    components: lobby-t10,lobby-t10
    namespace: dev
  only:
    - develop
  before_script:
    - export KUBECONFIG=$kubeconfig_dev
  script:
    - export TAG="20220915.57"
    - |
      IFS=',' read -r -a componentArray <<< "$components"
      for component in "${componentArray[@]}" 
      do
         kubectl set image deployment/${component} ${component}=${ImageName}:${TAG} --record -n $namespace
      done

notification:
  stage: .post
  script: 
    - echo "Telegram_Bot_Url=$Telegram_Bot_Url"
    - echo "Telegram_Chat_Id=$Telegram_Chat_Id"
    - echo "CI_SERVER_URL=$CI_SERVER_URL"
    - echo "GITLAB_USER_LOGIN=$GITLAB_USER_LOGIN"
    - echo "CI_REPOSITORY_URL=$CI_REPOSITORY_URL"
    - echo "CI_PROJECT_URL=$CI_PROJECT_URL"
    - echo "CI_PROJECT_TITLE=$CI_PROJECT_TITLE"
    - echo "CI_PROJECT_PATH=$CI_PROJECT_PATH"
    - echo "CI_PROJECT_NAME=$CI_PROJECT_NAME"
    - echo "CI_PIPELINE_URL=$CI_PIPELINE_URL"
    - echo "CI_PAGES_URL=$CI_PAGES_URL"
    - echo "CI_JOB_URL=$CI_JOB_URL"
    - echo "CI_ENVIRONMENT_NAME=$CI_ENVIRONMENT_NAME"
    - echo "CI_JOB_STATUS=$CI_JOB_STATUS"
    - echo "CI_JOB_NAME=$CI_JOB_NAME"
    - echo "CI_JOB_STAGE=$CI_JOB_STAGE"
    - echo "CI_MERGE_REQUEST_TARGET_BRANCH_NAME=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - echo "CI_COMMIT_BRANCH=$CI_COMMIT_BRANCH"
    - |
      curl --location --request POST $Telegram_Bot_Url \
      --header 'Content-Type: application/json' \
      --data-raw '{
          "text": "test2",
          "chat_id": $Telegram_Chat_Id,
          "parse_mode": "HTML"
      }'
