variables:
  ImageName: pgtgs/lobby-t10
  GIT_SUBMODULE_STRATEGY: recursive # 會把submodule中的submodule也引進到項目中
  message: ""
  
stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/
build:
  stage: build
  only:
    - master
    - release/current
    - develop
  before_script:
    - echo "branch:$CI_COMMIT_BRANCH"
    - git config --file=.gitmodules submodule.src/components/Wap.branch $CI_COMMIT_BRANCH
    - git config --file=.gitmodules submodule.src/components/App/Account.branch $CI_COMMIT_BRANCH
    - git config --file=.gitmodules submodule.src/api-services.branch $CI_COMMIT_BRANCH
    - git submodule sync
    - git submodule update
  script:
    - export TAG="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d).$CI_PIPELINE_IID"
    - docker build -t ${ImageName}:${TAG} .
    - docker push ${ImageName}:${TAG}
  artifacts:
    untracked: true
    expire_in: "1 days"

deploy-dev:
  stage: deploy
  variables:
    GIT_STRATEGY: none
    components: lobby-t10,lobby-t10
    namespace: dev
  needs:
    - build
  only:
    - develop
  before_script:
    - export KUBECONFIG=$kubeconfig_dev
  script:
    - export TAG="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d).$CI_PIPELINE_IID"
    - echo "CI_SERVER_URL=$CI_SERVER_URL"
    - echo "GITLAB_USER_LOGIN=$GITLAB_USER_LOGIN"
    - echo "CI_REPOSITORY_URL=$CI_REPOSITORY_URL"
    - echo "CI_PROJECT_URL=$CI_PROJECT_URL"
    - echo "CI_PROJECT_TITLE=$CI_PROJECT_TITLE"
    - echo "CI_PROJECT_PATH=$CI_PROJECT_PATH"
    - echo "CI_PROJECT_NAME=$CI_PROJECT_NAME"
    - echo "CI_PIPELINE_URL=$CI_PIPELINE_URL"
    - echo "CI_PAGES_URL=$CI_PAGES_URL"
    - echo "CI_JOB_URL=$CI_JOB_URL"
    - echo "CI_ENVIRONMENT_NAME=$CI_ENVIRONMENT_NAME"
    - echo "CI_JOB_STATUS=$CI_JOB_STATUS"
    - echo "CI_JOB_NAME=$CI_JOB_NAME"
    - echo "CI_JOB_STAGE=$CI_JOB_STAGE"
    - echo "CI_MERGE_REQUEST_TARGET_BRANCH_NAME=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - echo "CI_COMMIT_BRANCH=$$CI_COMMIT_BRANCH"
    - |
      IFS=',' read -r -a componentArray <<< "$components"
      for component in "${componentArray[@]}" 
      do
         kubectl set image deployment/${component} ${component}=${ImageName}:${TAG} --record -n $namespace
      done

notification:
  stage: .post
  script: 
    - |
      curl --location --request POST 'https://api.telegram.org/bot1780137038:AAHDIVxs2somlHZ5QbZKq1X403NnWAPXVn4/sendMessage' \
      --header 'Content-Type: application/json' \
      --data-raw '{
          "chat_id": "-1001114115188",
          "text": "<b>$CI_PROJECT_TITLE ($CI_JOB_NAME)</b><b>Pipeline: $CI_PIPELINE_URL</b>",
          "parse_mode": "HTML"
      }'
