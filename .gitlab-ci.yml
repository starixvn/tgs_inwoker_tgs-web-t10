include:
  - project: 'inwoker/tgs/tgs-gitlab-ci-jobs'
    ref: main
    file: '/templates/.lobby-deployment.yaml'

variables:
  ImageName: pgtgs/lobby-t10
  
build:
  extends: .build
  tags:
  - local-build
  only:
    - master
    - release/current
    - develop

deploy-dev:
  extends: .deploy-base
  variables:
    namespace: "dev"
    components: "dev_t10"
  tags:
    - dev
    - deploy
    - kubernetes
  only:
    - develop

deploy-staging:
  extends: .deploy-base
  variables:
    namespace: "staging"
    components: "staging_t10"
  tags:
    - staging
    - deploy
    - kubernetes
  only:
    - release/current
  when: manual

deploy-prod:
  extends: .deploy-base
  variables:
    namespace: "prod"
    components: "prod_t10"
  tags:
    - staging
    - deploy
    - kubernetes
  only:
    - master
  when: manual