variables:
  ImageName: pgtgs/lobby-t10
  GIT_SUBMODULE_STRATEGY: recursive # 會把submodule中的submodule也引進到項目中
  message: ""
  
stages:
  - build
  - deploy
  
build:
  stage: build
  only:
    - master
    - release/current
    - develop
  before_script:
    - echo "branch:$CI_COMMIT_BRANCH"
    - git config --file=.gitmodules submodule.src/components/Wap.branch $CI_COMMIT_BRANCH
    - git config --file=.gitmodules submodule.src/components/App/Account.branch $CI_COMMIT_BRANCH
    - git config --file=.gitmodules submodule.src/api-services.branch $CI_COMMIT_BRANCH
    - git submodule sync
  script:
    - export TAG="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    - docker build -t ${ImageName}:${TAG} .
    - docker push ${ImageName}:${TAG}
  artifacts:
    untracked: true
    expire_in: "1 days"

deploy-dev:
  stage: deploy
  variables:
    GIT_STRATEGY: none
    components: lobby-t10
    namespace: dev
  needs:
    - build
  only:
    - develop
  before_script:
    - export KUBECONFIG=$kubeconfig_dev
  script:
    - export TAG="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    - |
      componentArray = $components.split(",")
      for (i = 0;i < componentArray.length; i++) {
        message += "\n    ${componentArray[i]}"
        sh "kubectl set image deployment/${componentArray[i]} ${componentArray[i]}=${ImageName}:${TAG} --record -n $namespace"
      }
